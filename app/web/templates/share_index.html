<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Entropy — read-only reports</title><style>:root{color-scheme:dark;--bg:#0d1117;--p:#161b22;--b:#30363d;--t:#f0f6fc;--m:#8b949e;--a:#58a6ff;--g:#3fb950;--w:#d29922;--r:#f85149}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui}main{max-width:1500px;margin:auto;padding:22px}a{color:var(--a);text-decoration:none}a:hover{text-decoration:underline}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:9px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-weight:650;overflow-wrap:anywhere}.status{font-size:.75rem;border:1px solid var(--b);border-radius:999px;padding:3px 8px;white-space:nowrap}.status.complete,.status.ready{color:var(--g);border-color:var(--g)}.status.failed{color:var(--r);border-color:var(--r)}.status.running\/incomplete,.status.analyzing{color:var(--w);border-color:var(--w)}.summary{color:var(--m);font-size:.88rem;min-height:1.2em}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:auto}.primary{background:var(--a);color:#07111f;padding:7px 11px;border-radius:8px;font-weight:650}.primary:hover{text-decoration:none;filter:brightness(1.08)}@media(max-width:600px){main{padding:15px}.grid{grid-template-columns:1fr}}</style></head><body><main><header class="head"><div><h1>Camera Entropy — raporty read-only</h1><div class="muted">{{ version }}</div></div><div><a href="api/runs">API runs</a> · <a href="api/latest">API latest</a></div></header><div class="grid">{% for r in rows %}<article class="card"><div class="top"><a class="name" href="/share/{{ token }}/data/{{ r.name }}/">{{ r.name }}</a><span class="status {{ r.status }}">{{ r.status }}</span></div><div class="summary">{{ r.report_label }}{% if r.headline %} · {{ r.headline }}{% endif %}</div><div class="summary">{{ r.modified }}</div><div class="actions">{% if r.report %}<a class="primary" href="/share/{{ token }}{{ r.report }}">Otwórz raport</a>{% endif %}<a href="/share/{{ token }}/data/{{ r.name }}/">Pliki</a></div></article>{% else %}<p>Brak wyników.</p>{% endfor %}</div></main></body></html>
