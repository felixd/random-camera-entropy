<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Entropy — logowanie</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--accent:#58a6ff;--bad:#ff7b72}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.box{width:min(420px,calc(100% - 32px));background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 18px 60px #0008}h1{margin:0 0 8px;font-size:1.35rem}p{color:var(--muted)}label{display:block;margin:16px 0 6px}input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:#0d1117;color:var(--text)}button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#07111f;font-weight:700;cursor:pointer}.error{color:var(--bad);border:1px solid #ff7b7266;background:#ff7b7212;border-radius:8px;padding:10px}small{display:block;margin-top:20px;color:var(--muted)}
</style></head><body><main class="box"><h1>Camera Entropy Control</h1><p>Panel sterowania testami i raportami.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label for="username">Użytkownik</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Hasło</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Zaloguj</button></form><small>{{ version }}</small></main></body></html>
